<svg xmlns="http://www.w3.org/2000/svg" width="320" height="270" viewBox="0 0 320 270" role="img"><title>页面示意图，非实机截图</title><rect width="320" height="270" fill="#0b1214"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="320" height="30" rx="0" fill="#284b32"/><rect x="4" y="2" width="29" height="26" rx="6" fill="#ffa000"/><text x="10" y="22" fill="#0b1214" font-size="22">←</text><text x="42" y="21" fill="#beed35" font-size="14">GPS状态</text><text x="252" y="20" fill="#a4b4b7" font-size="12">--% ▯</text><text x="12" y="52" fill="#f4f7f6" font-size="12">GPS开关、重启；关闭、等待数据、搜星或定</text><text x="12" y="74" fill="#a4b4b7" font-size="12">位成功等状态；可见及使用卫星数、接收数据统</text><text x="12" y="96" fill="#a4b4b7" font-size="12">计、最近坐标；打开地图按钮。</text><rect x="10" y="155" width="300" height="33" rx="6" fill="#162429"/><text x="20" y="176" fill="#f4f7f6" font-size="13">GPS开关</text><rect x="10" y="193" width="300" height="33" rx="6" fill="#162429"/><text x="20" y="214" fill="#f4f7f6" font-size="13">重启GPS</text><text x="14" y="211" fill="#a4b4b7" font-size="10">上下浏览更多项；完整功能见表</text><text x="8" y="260" fill="#a4b4b7" font-size="10">页面结构示意 · 非实机截图/非像素还原</text></g></svg>
