[WioTrackerL2Pro]
extends = esp32_base
board = seeed-wio-tracker-l2-pro
board_build.partitions = default_16MB.csv
build_flags =
  ${esp32_base.build_flags}
  -I variants/wio-tracker-l2-pro
  -D SEEED_WIO_TRACKER_L2_PRO
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=L2RadioWrapper
  -D P_LORA_SCLK=4
  -D P_LORA_MISO=5
  -D P_LORA_MOSI=6
  -D P_LORA_NSS=21
  -D P_LORA_RESET=7
  -D P_LORA_DIO_1=9
  -D P_LORA_BUSY=8
  -D P_LORA_TX_LED=43
  -D PIN_USER_BTN=0
  -D PIN_BOARD_SDA=47
  -D PIN_BOARD_SCL=48
  -D SX126X_DIO3_TCXO_VOLTAGE=3.0
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D LORA_TX_POWER=14
  -D MAX_LORA_TX_POWER=22
  -D ENV_INCLUDE_GPS=1
  -D DISPLAY_CLASS=L2Display
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/wio-tracker-l2-pro/*.cpp>
; Same RadioLib revision as arduino_base, distributed as an immutable archive.
; This avoids requiring git clone on first-time Windows installations.
lib_deps =
  SPI
  Wire
  RadioLib=https://codeload.github.com/jgromes/RadioLib/zip/6d8934836678d8894e3d556550475b37dce3e2b6
  rweather/Crypto @ ^0.4.0
  adafruit/RTClib @ ^2.1.3
  melopero/Melopero RV3028 @ ^1.1.0
  electroniccats/CayenneLPP @ 1.6.1
  LovyanGFX=https://codeload.github.com/lovyan03/LovyanGFX/zip/refs/tags/1.2.28
  stevemarple/MicroNMEA @ 2.0.6
  earlephilhower/ESP8266Audio @ 1.9.7
  arduino-audio-driver=https://codeload.github.com/pschatzmann/arduino-audio-driver/zip/1afd1f2901b7b5413a20b5b6b5ae950dafe48b42

[env:WioTrackerL2Pro_companion_radio_usb]
extends = WioTrackerL2Pro
build_flags = ${WioTrackerL2Pro.build_flags}
  -I examples/companion_radio/ui-seeed
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=64
  -D ENABLE_USB_INTERFACE
  -D ADVERT_NAME='"Wio L2 Pro"'
build_src_filter = ${WioTrackerL2Pro.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-seeed/*.cpp>
lib_deps = ${WioTrackerL2Pro.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:WioTrackerL2Pro_companion_radio_ble]
extends = env:WioTrackerL2Pro_companion_radio_usb
build_flags = ${env:WioTrackerL2Pro_companion_radio_usb.build_flags}
  -D BLE_PIN_CODE=123456
build_src_filter = ${env:WioTrackerL2Pro_companion_radio_usb.build_src_filter}
  +<helpers/esp32/SerialBLEInterface.cpp>
