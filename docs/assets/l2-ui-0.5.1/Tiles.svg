<svg xmlns="http://www.w3.org/2000/svg" width="320" height="270" viewBox="0 0 320 270" role="img"><title>页面示意图，非实机截图</title><rect width="320" height="270" fill="#0b1214"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="320" height="30" rx="0" fill="#284b32"/><rect x="4" y="2" width="29" height="26" rx="6" fill="#ffa000"/><text x="10" y="22" fill="#0b1214" font-size="22">←</text><text x="42" y="21" fill="#beed35" font-size="14">离线瓦片</text><text x="252" y="20" fill="#a4b4b7" font-size="12">--% ▯</text><rect x="10" y="37" width="300" height="52" rx="6" fill="#162429"/><text x="20" y="58" fill="#f4f7f6" font-size="13">Offline tiles on/off</text><text x="20" y="79" fill="#a4b4b7" font-size="11">保存并在重启后保留开关并使地图重绘</text><rect x="10" y="95" width="300" height="52" rx="6" fill="#162429"/><text x="20" y="116" fill="#f4f7f6" font-size="13">Zoom - / +</text><text x="20" y="137" fill="#a4b4b7" font-size="11">调整地图缩放，留本页</text><rect x="10" y="153" width="300" height="52" rx="6" fill="#162429"/><text x="20" y="174" fill="#f4f7f6" font-size="13">Rescan SD</text><text x="20" y="195" fill="#a4b4b7" font-size="11">重读相关地图数据/轨迹/航点并提示</text><text x="8" y="260" fill="#a4b4b7" font-size="10">页面结构示意 · 非实机截图/非像素还原</text></g></svg>
